[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-loop-graph"
version = "1.0.0"
description = "Autonomous Loop & Graph Engineering Engine for Google Antigravity & AI Coding Agents"
readme = "README.md"
authors = [{ name = "axxion" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/axxion/antigravity-loop-graph"
Repository = "https://github.com/axxion/antigravity-loop-graph"
Issues = "https://github.com/axxion/antigravity-loop-graph/issues"

[project.scripts]
loopgraph = "loopgraph.cli:main"
